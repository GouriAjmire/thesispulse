server:
  port: 8080

spring:
  application:
    name: thesispulse
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/thesispulse}
    username: ${DB_USER:thesispulse}
    password: ${DB_PASSWORD:thesispulse}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  admin:
    username: ${ADMIN_USER:admin}
    # No default on purpose: the app refuses to start until an admin password is set.
    password: ${ADMIN_PASSWORD}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  enquiries:
    recipient: ${ENQUIRY_RECIPIENT:gouriajmire@gmail.com}
    from: ${SMTP_FROM:}
